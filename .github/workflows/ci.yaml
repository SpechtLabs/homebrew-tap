name: CI

# The formulae and casks here are written by the release pipelines of other
# repositories (GoReleaser, the telegram-tui release workflow), which push
# straight to main. This checks every such push, and every pull request, the
# way Homebrew checks a tap: a file that brew can't load, or that brew style
# or brew audit rejects, turns main red here instead of failing on a user's
# `brew install`. The fix then belongs in the generating repository, since a
# hand edit here is overwritten by the next release.
on:
  # The filter excludes rather than lists, so a new directory runs CI by
  # default.
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.2
  # The lint job installs only these, with mise-action's install_args, and
  # mise run doesn't install the rest (pinact) on its own.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  MISE_TOOLS: yamllint actionlint shellcheck

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  # Homebrew isn't a tool mise can pin, so this runs on a macOS runner, which
  # ships with it, set up the way `brew tap-new` sets up a tap's own tests:
  # setup-homebrew links this checkout in as the spechtlabs/tap tap. Of that
  # template it keeps only the syntax job (brew readall, brew style and brew
  # audit over the whole tap): the packages here are prebuilt binaries, so
  # there are no bottles to build.
  tap-syntax:
    name: brew style and audit
    runs-on: macos-latest
    defaults:
      run:
        shell: bash -xeuo pipefail {0}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # brew style installs RuboCop and its gems on first use.
      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
